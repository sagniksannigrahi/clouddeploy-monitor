# CI/CD pipeline for CloudDeploy Monitor
#
#   test  ──►  docker  ──►  deploy
#
# Each job only runs if the one before it succeeded, so a failing test
# stops the pipeline and nothing gets deployed.

name: CI/CD

on:
  push:
    branches: [main]      # every push to main: test, build, deploy
  pull_request:
    branches: [main]      # pull requests: test and build only, never deploy
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

# The workflow only needs to read the code.
permissions:
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build and test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t clouddeploy-monitor:ci .

      - name: Start container (using Render's default port 10000)
        run: docker run -d --name app -e PORT=10000 -p 10000:10000 clouddeploy-monitor:ci

      - name: Check the container answers /health
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:10000/health; then
              echo ""
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy. Logs:"
          docker logs app
          exit 1

  deploy:
    name: Deploy to Render
    needs: [test, docker]
    # Deploy only from main, and never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger Render deploy hook
        id: hook
        env:
          # Stored in GitHub: Settings > Secrets and variables > Actions > Secrets
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK secret is not set, so nothing was deployed. See README, section 'Cloud deployment with Render'."
            echo "### Deployment skipped: RENDER_DEPLOY_HOOK secret is not set" >> "$GITHUB_STEP_SUMMARY"
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Ask Render to deploy exactly the commit that just passed the tests.
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) url="${RENDER_DEPLOY_HOOK}&ref=${GITHUB_SHA}" ;;
            *)    url="${RENDER_DEPLOY_HOOK}?ref=${GITHUB_SHA}" ;;
          esac

          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "$url")
          echo "Render responded with HTTP $code"
          case "$code" in
            200) echo "Deploy started for commit ${GITHUB_SHA::7}." ;;
            202) echo "Render says a deploy is already in progress; it will pick up this commit." ;;
            *)   echo "::error::Render deploy hook failed (HTTP $code). Check the RENDER_DEPLOY_HOOK secret."; exit 1 ;;
          esac
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Wait until the new version is live
        if: steps.hook.outputs.triggered == 'true'
        env:
          # Not secret. Stored in GitHub: Settings > Secrets and variables > Actions > Variables
          APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::notice::RENDER_APP_URL variable is not set, so the live site was not checked."
            exit 0
          fi
          short_sha="${GITHUB_SHA::7}"
          echo "Waiting for $APP_URL to show commit $short_sha ..."
          # The dashboard prints the running commit, so we can tell when the new version is up.
          for _ in $(seq 1 40); do
            if curl -fsS --max-time 30 "$APP_URL/" | grep -q "$short_sha"; then
              echo "New version is live:"
              curl -fsS "$APP_URL/health"
              echo ""
              echo "### Deployed commit \`$short_sha\` to $APP_URL" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Commit $short_sha did not go live within 10 minutes. Check the deploy logs in Render."
          exit 1
