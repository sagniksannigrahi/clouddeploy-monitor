# CI/CD pipeline for CloudDeploy Monitor
#
#   test  ──►  docker  ──►  deploy (SCP + SSH to AWS EC2)
#
# Each job only runs if the one before it succeeded, so a failing test
# stops the pipeline and nothing gets deployed.

name: CI/CD

on:
  push:
    branches: [main]      # every push to main: test, build, deploy
  pull_request:
    branches: [main]      # pull requests: test and build only, never deploy
  workflow_dispatch:      # adds a "Run workflow" button in the Actions tab

# The workflow only needs to read the code.
permissions:
  contents: read

# Never run two deployments at the same time.
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        run: pytest -v

  docker:
    name: Build and test Docker image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg GIT_COMMIT="$GITHUB_SHA" -t clouddeploy-monitor:ci .

      - name: Start container
        run: docker run -d --name app -p 8080:8080 clouddeploy-monitor:ci

      - name: Check the container answers /health
        run: |
          for _ in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo ""
              echo "Container is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "Container did not become healthy. Logs:"
          docker logs app
          exit 1

  deploy:
    name: Deploy to AWS EC2
    needs: [test, docker]
    # Deploy only from main, and never from pull requests.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # All four are stored in GitHub: Settings > Secrets and variables > Actions
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - name: Check deployment secrets are set
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -n "$EC2_HOST" ]        || missing="$missing EC2_HOST"
          [ -n "$EC2_USER" ]        || missing="$missing EC2_USER"
          [ -n "$EC2_SSH_KEY" ]     || missing="$missing EC2_SSH_KEY"
          [ -n "$EC2_KNOWN_HOSTS" ] || missing="$missing EC2_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing. Nothing was deployed. See README section 'GitHub Actions CI/CD'."
            exit 1
          fi

      - name: Check out code
        uses: actions/checkout@v7

      - name: Package the application
        run: |
          # git archive packs exactly the committed files (never .venv, keys or local junk).
          git archive --format=tar.gz --output clouddeploy.tar.gz HEAD
          ls -lh clouddeploy.tar.gz

      - name: Set up SSH (key + verified host key)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_deploy_key
          chmod 600 ~/.ssh/ec2_deploy_key
          # Only this host key is trusted. If the server presents a different key,
          # SSH refuses to connect (protects against man-in-the-middle attacks).
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User $EC2_USER
            IdentityFile ~/.ssh/ec2_deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 20
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy package to EC2 (SCP)
        run: scp clouddeploy.tar.gz "ec2:/tmp/clouddeploy-${GITHUB_SHA}.tar.gz"

      - name: Extract and deploy on EC2 (SSH)
        run: |
          # The commit and branch are filled in here on the runner (on purpose) and
          # passed as arguments; the script between the REMOTE markers runs on EC2.
          # shellcheck disable=SC2029
          ssh ec2 "bash -s -- '$GITHUB_SHA' '$GITHUB_REF_NAME'" <<'REMOTE'
          set -euo pipefail
          SHA="$1"; BRANCH="$2"
          PKG="/tmp/clouddeploy-$SHA.tar.gz"
          # Unpack into a fresh folder, then swap it in place of the old code.
          rm -rf /opt/clouddeploy/app.new
          mkdir -p /opt/clouddeploy/app.new
          tar -xzf "$PKG" -C /opt/clouddeploy/app.new
          rm -f "$PKG"
          rm -rf /opt/clouddeploy/app
          mv /opt/clouddeploy/app.new /opt/clouddeploy/app
          cd /opt/clouddeploy/app
          bash deploy.sh "$SHA" "$BRANCH" "GitHub Actions"
          REMOTE

      - name: Verify the public URL serves the new version
        run: |
          short_sha="${GITHUB_SHA::7}"
          for _ in $(seq 1 10); do
            live=$(curl -fsS --max-time 10 "http://$EC2_HOST/api/status" \
                   | python3 -c 'import sys, json; print(json.load(sys.stdin)["deployment"]["commit"])' || true)
            if [ "$live" = "$short_sha" ]; then
              echo "Live at http://$EC2_HOST running commit $short_sha"
              curl -fsS "http://$EC2_HOST/health"; echo
              echo "### Deployed commit \`$short_sha\` to AWS EC2" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 6
          done
          echo "::error::The public URL is not serving commit $short_sha. Check the security group (port 80) and 'docker logs clouddeploy-monitor' on the server."
          exit 1

      - name: Remove SSH key from the runner
        if: always()
        run: rm -f ~/.ssh/ec2_deploy_key
