# Render Blueprint: describes the cloud service so Render can create it for you.
# In Render: New > Blueprint > pick this repository.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: clouddeploy-monitor
    runtime: docker            # build from the Dockerfile in this repo
    plan: free                 # free instance (spins down after 15 min without traffic)
    region: oregon
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health   # Render waits for this to return 200 before switching traffic
    # Deploys are triggered by GitHub Actions (after tests pass) through the
    # deploy hook, so Render's own "deploy on every commit" is turned off.
    autoDeployTrigger: "off"
